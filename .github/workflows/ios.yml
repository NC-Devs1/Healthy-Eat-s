 iOS Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build and Test
    runs-on: macos-14

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Select Xcode version
      run: sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer

    - name: Show Xcode version
      run: xcodebuild -version

    - name: Build for iOS Simulator
      run: |
        xcodebuild clean build \
          -project HealthyEats.xcodeproj \
          -scheme HealthyEats \
          -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.2' \
          -configuration Debug \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

    - name: Run Tests
      run: |
        xcodebuild test \
          -project HealthyEats.xcodeproj \
          -scheme HealthyEats \
          -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.2' \
          -configuration Debug \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO || true

  archive:
    name: Archive for Distribution
    runs-on: macos-14
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Select Xcode version
      run: sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer

    - name: Archive
      run: |
        xcodebuild archive \
          -project HealthyEats.xcodeproj \
          -scheme HealthyEats \
          -destination 'generic/platform=iOS' \
          -archivePath $RUNNER_TEMP/HealthyEats.xcarchive \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

    - name: Upload Archive
      uses: actions/upload-artifact@v4
      with:
        name: HealthyEats-Archive
        path: ${{ runner.temp }}/HealthyEats.xcarchive
        retention-days: 30
